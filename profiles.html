<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PLAYLAB · B안 프로필 선택</title>
<meta name="description" content="교육용 비영리 UI/UX A/B 테스트 페이지(B안) 시청 프로필 선택. 실제 서비스와 무관합니다.">
<link rel="stylesheet" href="css/tokens.css?v=8">
<link rel="stylesheet" href="css/style.css?v=44">
<link rel="stylesheet" href="css/b.css?v=207">
</head>
<body data-page="profiles">
<a class="pfs-close" href="profile.html" aria-label="닫기">✕</a>
<main class="pfs">
  <h1>시청할 프로필을 선택해 주세요</h1>
  <div class="pf-avatars" role="radiogroup" aria-label="시청 프로필">
    <button role="radio" aria-checked="true" class="on" data-p="me"><span class="pa me big">나</span><small>내 프로필</small></button>
    <button role="radio" aria-checked="false" data-p="kids"><span class="pa kids big">키즈</span><small>키즈</small></button>
    <button data-p="add"><span class="pa add big">＋</span><small>프로필 추가</small></button>
  </div>
</main>
<script src="js/common.js?v=226"></script>
<script>
  App.mountShell();
  App.Logger.log("page_view", { section: "profiles" });
  document.querySelector(".pf-avatars").addEventListener("click", (e) => {
    const b = e.target.closest("[data-p]"); if (!b) return;
    App.Logger.log("gnb_click", { value: "profile_select:" + b.dataset.p });
    if (b.dataset.p === "add") { App.toast("교육용 테스트 페이지: 프로필 추가는 제공되지 않아요."); return; }
    location.href = b.dataset.p === "kids" ? "kids.html" : "index.html";
  });
</script>
</body>
</html>
