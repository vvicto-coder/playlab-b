<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>이미지 출처 · PLAYLAB</title>
<link rel="stylesheet" href="css/tokens.css?v=8">
<link rel="stylesheet" href="css/style.css?v=44">
<link rel="stylesheet" href="css/b.css?v=207">
</head>
<body>
<header class="gnb" id="gnb"></header>
<main class="page">
  <h1>이미지 출처</h1>
  <p>교육용 비영리 테스트 페이지입니다. 이미지는 Openverse를 통해 찾은 CC0 / 공공 도메인 / CC BY 소재이며, 가상 작품과 이미지 속 인물·장소는 무관합니다.</p>
  <div style="overflow-x:auto"><table class="credit-table"><thead><tr><th>가상 작품</th><th>이미지</th><th>저작자</th><th>라이선스</th><th>원본</th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<script src="js/common.js?v=226"></script>
<script>
  App.mountShell();
  Promise.all([fetch("data/image_credits.json").then(r => r.json()), fetch("data/sports_credits.json").then(r => r.json()).catch(() => ({}))]).then(([a, b]) => {
    const d = Object.assign({}, a, b);
    document.getElementById("rows").innerHTML = Object.values(d).map(v => {
      const lic = (v.license || "").toUpperCase() + " " + (v.license_version || "");
      return `<tr><td>${App.esc(v.title)}</td><td>${App.esc(v.photo_title)}</td><td>${App.esc(v.creator || "미상")}</td>
        <td><a href="${App.esc(v.license_url)}" rel="noopener">${App.esc(lic.trim())}</a></td><td><a href="${App.esc(v.landing_url)}" rel="noopener">원본</a></td></tr>`;
    }).join("");
  });
</script>
</body>
</html>
